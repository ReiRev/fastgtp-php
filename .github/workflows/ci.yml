name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer format-check
      - run: composer test

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          # The newest PHP.
          php-version: "8.5"
          coverage: none
      # The same server as on a developer's machine: tests/server/compose.yaml.
      - name: Start fastgtp with GNU Go and KataGo
        run: docker compose -f tests/server/compose.yaml up -d --build --wait
      - run: composer update --no-interaction --no-progress
      - run: composer test-integration
        env:
          FASTGTP_URL: http://127.0.0.1:8000
      - name: Show the fastgtp log
        if: failure()
        run: docker compose -f tests/server/compose.yaml logs
